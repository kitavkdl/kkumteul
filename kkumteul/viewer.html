<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>세계 관찰 화면</title>
<style>
:root {
  --surface-0: #f3f2ef; --surface-1: #fcfcfb; --line: #dddcd6;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a897f;
  --series-1: #2a78d6; --food: #9a9990; --select: #eb6834;
  --seq-lo: #cde2fb; --seq-hi: #0d366b; --map: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-0: #111110; --surface-1: #1a1a19; --line: #383835;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8a897f;
    --series-1: #3987e5; --food: #6b6a63; --select: #d95926;
    --seq-lo: #184f95; --seq-hi: #cde2fb; --map: #0c0c0b;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.4 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px;
  background: var(--surface-1); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
select, button { font: inherit; color: var(--text-primary); background: var(--surface-0);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
button { cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--series-1); box-shadow: inset 0 0 0 1px var(--series-1); }
label { color: var(--text-secondary); }
main { flex: 1; display: flex; min-height: 0; }
#mapwrap { flex: 1; position: relative; min-width: 0; background: var(--map); }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#hud { position: absolute; left: 10px; top: 8px; color: var(--text-secondary); font-size: 12px;
  background: color-mix(in srgb, var(--surface-1) 85%, transparent); padding: 4px 8px; border-radius: 6px;
  font-variant-numeric: tabular-nums; pointer-events: none; }
#scale { position: absolute; right: 10px; top: 8px; font-size: 12px; color: var(--text-secondary);
  background: color-mix(in srgb, var(--surface-1) 85%, transparent); padding: 4px 8px; border-radius: 6px;
  display: none; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
#scale i { display: inline-block; width: 70px; height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, var(--seq-lo), var(--seq-hi)); }
aside { width: 320px; overflow-y: auto; background: var(--surface-1); border-left: 1px solid var(--line);
  padding: 12px; display: flex; flex-direction: column; gap: 14px; }
aside h2 { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 0 0 6px;
  letter-spacing: .02em; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.kv span:nth-child(odd) { color: var(--text-secondary); }
.kv span:nth-child(even) { text-align: right; }
.chart { position: relative; padding-bottom: 6px; }
.chart .top { display: flex; justify-content: space-between; align-items: baseline; }
.chart .name { color: var(--text-secondary); font-size: 12px; }
.chart .val { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart canvas { width: 100%; height: 64px; display: block; }
.chart .range { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 11px;
  font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface-0); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 7px; font-size: 12px; display: none; white-space: nowrap; z-index: 2;
  font-variant-numeric: tabular-nums; }
.tip b { font-weight: 600; }
.tip span { color: var(--text-secondary); margin-left: 6px; }
details { color: var(--text-secondary); font-size: 12px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; margin-top: 6px; }
th, td { text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); }
th { font-weight: 500; color: var(--text-muted); }
footer { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 8px 12px;
  background: var(--surface-1); border-top: 1px solid var(--line); }
footer input[type=range] { flex: 1; min-width: 140px; }
#stepno { font-variant-numeric: tabular-nums; color: var(--text-secondary); min-width: 150px; }
#note { color: var(--text-muted); font-size: 12px; }
@media (max-width: 800px) {
  main { flex-direction: column; }
  #mapwrap { height: 55vh; flex: none; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); flex: 1; }
}
</style>
</head>
<body>
<header>
  <h1>세계 관찰 화면</h1>
  <label>실행 <select id="run"></select></label>
  <label>색 <select id="mode">
    <option value="lineage">계통(색 유전자)</option>
    <option value="energy">에너지</option>
    <option value="gen">세대</option>
    <option value="brain">뇌 크기</option>
    <option value="age">나이</option>
    <option value="sig">신호(2~3단계)</option>
    <option value="eta">학습률(2단계)</option>
  </select></label>
  <label><input type="checkbox" id="ground" checked> 길·거름</label>
  <button id="fit">전체 보기</button>
  <span id="note"></span>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="hud"></div>
    <div id="scale"><span id="lo"></span><i></i><span id="hi"></span></div>
  </div>
  <aside>
    <section>
      <h2>고른 개체</h2>
      <div id="agent" class="kv"><span>없음</span><span>지도에서 개체를 누르세요</span></div>
      <p style="margin:8px 0 0"><button id="follow" aria-pressed="false">따라가기</button></p>
    </section>
    <section>
      <h2>세계 숫자</h2>
      <div id="charts"></div>
      <details><summary>표로 보기</summary><div id="tablewrap"></div></details>
    </section>
  </aside>
</main>
<footer>
  <button id="live" aria-pressed="true">실시간</button>
  <button id="play">재생</button>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="시간">
  <span id="stepno"></span>
  <button id="clip" title="한 스텝씩 촘촘히 녹화된 가장 최근 구간으로 간다">촘촘한 구간</button>
  <button id="rec" title="지금부터 600스텝을 한 스텝씩 녹화하도록 요청한다">촘촘히 녹화</button>
</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString("ko-KR", { maximumFractionDigits: d, minimumFractionDigits: d });
const S = { run: null, steps: [], idx: 0, frame: null, cfg: null, live: true, playing: false,
  selected: null, follow: false, view: { scale: 1, cx: 256, cy: 256 }, stats: [], busy: false };
const map = $("map"), ctx = map.getContext("2d");

async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url); return r.json(); }

function parseFrame(buf) {
  const dv = new DataView(buf);
  const n = dv.getUint32(16, true), m = dv.getUint32(20, true);
  let o = 32;
  const a = new Float32Array(buf, o, n * 8); o += n * 32;
  const ids = new Uint32Array(buf, o, n); o += n * 4;
  const col = new Uint8Array(buf, o, n * 4); o += n * 4;
  const food = new Uint16Array(buf, o, m * 2); o += m * 4;
  const f = { step: Number(dv.getBigInt64(8, true)), n, m, w: dv.getFloat32(24, true), h: dv.getFloat32(28, true), a, ids, col, food, flags: 0 };
  if (dv.getUint8(3) === 50) {   // "WSF2": 잠·신호·학습률과 길·거름이 뒤에 붙는다
    f.extra = new Uint8Array(buf, o, n * 4); o += n * 4;
    f.gw = dv.getUint16(o, true); f.gh = dv.getUint16(o + 2, true); f.flags = dv.getUint8(o + 4); o += 8;
    if (f.flags & 4) { f.trail = new Uint8Array(buf, o, f.gw * f.gh); o += f.gw * f.gh; f.soil = new Uint8Array(buf, o, f.gw * f.gh); }
  }
  return f;
}

async function loadRuns() {
  const runs = await getJSON("/api/runs");
  const sel = $("run");
  const cur = sel.value;
  sel.replaceChildren(...runs.map(r => {
    const o = document.createElement("option");
    o.value = r.name;
    o.textContent = r.name + (r.kind && r.kind !== "new" ? " (" + ({ branch: "분기", passive: "대조" }[r.kind] || r.kind) + ")" : "");
    return o;
  }));
  if (runs.some(r => r.name === cur)) sel.value = cur;
  if (!S.run && runs.length) { S.run = sel.value; await refresh(true); fit(); }
  if (!runs.length) $("note").textContent = "실행 폴더가 비어 있습니다";
}

async function refresh(first) {
  if (!S.run || S.refreshing) return;   // 앞 요청이 안 끝났으면 겹쳐 보내지 않는다
  S.refreshing = true;
  try { await refreshOnce(first); } finally { S.refreshing = false; }
}
async function refreshOnce(first) {
  const run = S.run, after = first || !S.steps.length ? -1 : S.steps[S.steps.length - 1];
  const ix = await getJSON("/api/index?run=" + encodeURIComponent(run) + "&after=" + after);
  if (run !== S.run) return;
  if (after < 0) { S.cfg = ix.config; S.steps = ix.steps; }
  else if (ix.last != null && ix.last < after) { S.steps = []; return refreshOnce(true); }   // 이어 돌리며 되감긴 경우
  else {
    S.steps = S.steps.concat(ix.steps);
    if (ix.first != null && S.steps.length > ix.count + 2000) S.steps = S.steps.filter(s => s >= ix.first);   // 지워진 옛 프레임 정리
  }
  const sl = $("slider");
  sl.max = Math.max(0, S.steps.length - 1);
  if (S.live || first) S.idx = S.steps.length - 1;
  S.idx = Math.min(Math.max(S.idx, 0), S.steps.length - 1);
  sl.value = S.idx;
  if (S.steps.length && (S.live || first || !S.frame)) await showFrame();
  S.stats = await getJSON("/api/stats?run=" + encodeURIComponent(S.run) + "&max=300");
  drawCharts();
}

async function showFrame() {
  if (S.busy || !S.steps.length) return;
  S.busy = true;
  try {
    const step = S.steps[S.idx];
    const r = await fetch("/api/frame?run=" + encodeURIComponent(S.run) + "&step=" + step);
    if (r.ok) { S.frame = parseFrame(await r.arrayBuffer()); if (!S.fitted) fit(); draw(); drawCharts(); }
  } finally { S.busy = false; }
  $("slider").value = S.idx;
}

function resize() {
  const r = map.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  map.width = Math.round(r.width * d); map.height = Math.round(r.height * d);
  if (!S.fitted && S.frame && r.width > 0) fit(); else draw();
}
function fit() {
  const f = S.frame, r = map.getBoundingClientRect();
  const w = f ? f.w : 512, h = f ? f.h : 512;
  if (!(r.width > 0 && r.height > 0)) return;   // 아직 화면에 안 놓였으면 나중에 다시 맞춘다
  S.fitted = !!f;
  S.view.scale = Math.min(r.width / w, r.height / h) * 0.96;
  S.view.cx = w / 2; S.view.cy = h / 2;
  draw();
}
const toScreen = (x, y, r) => [(x - S.view.cx) * S.view.scale + r.width / 2, (y - S.view.cy) * S.view.scale + r.height / 2];

function lerpColor(a, b, t) {
  const p = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const x = p(a), y = p(b);
  return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")";
}

function draw() {
  const f = S.frame, r = map.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  if (!f) return;
  const sc = S.view.scale, mode = $("mode").value;
  if (S.follow && S.selected != null) {
    const i = f.ids.indexOf(S.selected);
    if (i >= 0) { S.view.cx = f.a[i * 8]; S.view.cy = f.a[i * 8 + 1]; }
  }
  const [x0, y0] = toScreen(0, 0, r);
  ctx.strokeStyle = css("--line"); ctx.lineWidth = 1;
  ctx.strokeRect(x0, y0, f.w * sc, f.h * sc);
  // 땅: 길(흔적)은 파랑, 거름은 주황. 판이 바뀌는 세계가 켜져 있을 때만 온다
  if (f.trail && $("ground").checked) {
    const cw = f.w / f.gw * sc, chh = f.h / f.gh * sc;
    for (let c = 0; c < f.gw * f.gh; c++) {
      const t = f.trail[c], so = f.soil[c];
      if (t < 8 && so < 8) continue;
      const [x, y] = toScreen((c % f.gw) * f.w / f.gw, Math.floor(c / f.gw) * f.h / f.gh, r);
      if (x < -cw || y < -chh || x > r.width || y > r.height) continue;
      if (t >= 8) { ctx.fillStyle = css("--series-1"); ctx.globalAlpha = t / 255 * 0.35; ctx.fillRect(x, y, cw, chh); }
      if (so >= 8) { ctx.fillStyle = css("--select"); ctx.globalAlpha = so / 255 * 0.55; ctx.fillRect(x, y, cw, chh); }
    }
    ctx.globalAlpha = 1;
  }
  // 먹이
  ctx.fillStyle = css("--food");
  const fs = Math.max(1.5, sc);
  for (let j = 0; j < f.m; j++) {
    const [x, y] = toScreen(f.food[2 * j] / 65536 * f.w, f.food[2 * j + 1] / 65536 * f.h, r);
    if (x < -4 || y < -4 || x > r.width + 4 || y > r.height + 4) continue;
    ctx.fillRect(x - fs / 2, y - fs / 2, fs, fs);
  }
  // 색 눈금
  let lo = 0, hi = 1, col = null;
  const colIdx = { energy: 3, age: 4, gen: 5, brain: 6 }[mode];
  if (colIdx != null) {
    lo = Infinity; hi = -Infinity;
    for (let i = 0; i < f.n; i++) { const v = f.a[i * 8 + colIdx]; if (v < lo) lo = v; if (v > hi) hi = v; }
    if (mode === "energy") { lo = 0; hi = S.cfg ? S.cfg.e_max : hi; }
    if (mode === "brain") { lo = 0; hi = S.cfg ? S.cfg.h_max : hi; }
    if (mode === "age") { lo = 0; hi = S.cfg ? S.cfg.max_age : hi; }
    if (!(hi > lo)) hi = lo + 1;
    $("scale").style.display = "flex";
    $("lo").textContent = fmt(lo); $("hi").textContent = fmt(hi);
    col = [css("--seq-lo"), css("--seq-hi")];
  } else $("scale").style.display = "none";
  // 개체
  const rad = (S.cfg ? S.cfg.agent_radius : 1) * sc, big = rad >= 3;
  for (let i = 0; i < f.n; i++) {
    const [x, y] = toScreen(f.a[i * 8], f.a[i * 8 + 1], r);
    if (x < -20 || y < -20 || x > r.width + 20 || y > r.height + 20) continue;
    if (mode === "sig" && f.extra) ctx.fillStyle = "rgb(" + f.extra[i * 4 + 1] + ",110," + f.extra[i * 4 + 2] + ")";   // 신호1은 빨강, 신호2는 파랑 쪽
    else if (mode === "eta" && f.extra) ctx.fillStyle = lerpColor(css("--seq-lo"), css("--seq-hi"), f.extra[i * 4 + 3] / 255);
    else ctx.fillStyle = col
      ? lerpColor(col[0], col[1], Math.min(1, Math.max(0, (f.a[i * 8 + colIdx] - lo) / (hi - lo))))
      : "rgb(" + f.col[i * 4] + "," + f.col[i * 4 + 1] + "," + f.col[i * 4 + 2] + ")";
    if (f.extra && f.extra[i * 4]) ctx.globalAlpha = 0.35;   // 자는 개체는 흐리게
    if (big) {
      const hd = f.a[i * 8 + 2];
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = css("--text-primary"); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(hd) * rad * 1.8, y + Math.sin(hd) * rad * 1.8); ctx.stroke();
    } else {
      const s = Math.max(3, rad * 2);
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    if (f.ids[i] === S.selected) {
      ctx.strokeStyle = css("--select"); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, Math.max(rad + 3, 7), 0, 6.2832); ctx.stroke();
      if (S.cfg && sc * S.cfg.vision_range > 12) {   // 시야 부채꼴
        const hd = f.a[i * 8 + 2], fov = S.cfg.vision_fov / 2, vr = S.cfg.vision_range * sc;
        ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, vr, hd - fov, hd + fov); ctx.closePath(); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }
  $("hud").textContent = "스텝 " + fmt(f.step) + " · 개체 " + fmt(f.n) + " · 먹이 " + fmt(f.m);
  const prev = S.idx > 0 ? S.steps[S.idx] - S.steps[S.idx - 1] : null;
  $("stepno").textContent = "스텝 " + fmt(f.step) + (prev ? " (앞 프레임과 " + fmt(prev) + "스텝 차)" : "");
  showAgent();
}

function showAgent() {
  const f = S.frame, box = $("agent");
  const row = (k, v) => { const a = document.createElement("span"), b = document.createElement("span"); a.textContent = k; b.textContent = v; return [a, b]; };
  if (!f || S.selected == null) { box.replaceChildren(...row("없음", "지도에서 개체를 누르세요")); return; }
  const i = f.ids.indexOf(S.selected);
  if (i < 0) { box.replaceChildren(...row("번호 " + S.selected, "이 프레임에는 없습니다(죽었거나 아직 안 태어남)")); return; }
  const a = f.a.subarray(i * 8, i * 8 + 8);
  box.replaceChildren(...row("번호", fmt(S.selected)), ...row("세대(계보 깊이)", fmt(a[5])), ...row("나이(스텝)", fmt(a[4])),
    ...row("에너지", fmt(a[3], 2)), ...row("활성 뉴런", fmt(a[6])), ...row("낳은 자식", fmt(a[7])),
    ...row("위치", fmt(a[0], 0) + ", " + fmt(a[1], 0)),
    ...(f.extra && f.flags ? [...row("자는 중", f.extra[i * 4] ? "예" : "아니오"),
      ...row("신호 1, 2", fmt(f.extra[i * 4 + 1] / 127.5 - 1, 2) + ", " + fmt(f.extra[i * 4 + 2] / 127.5 - 1, 2)),
      ...row("학습률(상한 대비)", fmt(f.extra[i * 4 + 3] / 255, 2))] : []));
}

// ---- 지도 조작 ----
const ptrs = new Map(); let moved = 0, pinch = 0;
map.addEventListener("pointerdown", e => { map.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; pinch = 0; });
map.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId), dx = e.clientX - p[0], dy = e.clientY - p[1];
  if (ptrs.size === 1) {
    S.view.cx -= dx / S.view.scale; S.view.cy -= dy / S.view.scale; moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 5) setFollow(false);
  }
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], dist = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) zoom(dist / pinch, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    pinch = dist; moved = 99;
  }
  draw();
});
const up = e => {
  if (ptrs.has(e.pointerId) && ptrs.size === 1 && moved <= 5) pick(e.clientX, e.clientY);
  ptrs.delete(e.pointerId); pinch = 0;
};
map.addEventListener("pointerup", up); map.addEventListener("pointercancel", up);
map.addEventListener("wheel", e => { e.preventDefault(); zoom(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); draw(); }, { passive: false });
function zoom(k, px, py) {
  const r = map.getBoundingClientRect(), v = S.view;
  const wx = (px - r.left - r.width / 2) / v.scale + v.cx, wy = (py - r.top - r.height / 2) / v.scale + v.cy;
  v.scale = Math.min(60, Math.max(0.2, v.scale * k));
  v.cx = wx - (px - r.left - r.width / 2) / v.scale; v.cy = wy - (py - r.top - r.height / 2) / v.scale;
}
function pick(px, py) {
  const f = S.frame; if (!f) return;
  const r = map.getBoundingClientRect(); let best = -1, bd = 18 * 18;
  for (let i = 0; i < f.n; i++) {
    const [x, y] = toScreen(f.a[i * 8], f.a[i * 8 + 1], r), d = (x - px + r.left) ** 2 + (y - py + r.top) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  S.selected = best >= 0 ? f.ids[best] : null;
  if (best < 0) setFollow(false);
  draw();
}
function setFollow(on) { S.follow = on; $("follow").setAttribute("aria-pressed", on); }
function setLive(on) { S.live = on; $("live").setAttribute("aria-pressed", on); if (on) setPlaying(false); }
function setPlaying(on) { S.playing = on; $("play").textContent = on ? "멈춤" : "재생"; if (on) setLive(false); }

// ---- 차트 (작은 여러 장, 한 장에 한 계열) ----
const CHARTS = [["pop", "개체 수", 0], ["food", "먹이", 0], ["gen_mean", "평균 세대(계보 깊이)", 1], ["hidden_mean", "평균 활성 뉴런", 2]];
function buildCharts() {
  $("charts").replaceChildren(...CHARTS.map(([key, name]) => {
    const d = document.createElement("div"); d.className = "chart"; d.dataset.key = key;
    d.innerHTML = '<div class="top"><span class="name"></span><span class="val"></span></div><canvas></canvas><div class="range"><span></span><span></span></div><div class="tip"><b></b><span></span></div>';
    d.querySelector(".name").textContent = name;
    const c = d.querySelector("canvas");
    c.addEventListener("pointermove", e => hover(d, e)); c.addEventListener("pointerleave", () => { d.hover = null; d.querySelector(".tip").style.display = "none"; drawChart(d); });
    return d;
  }));
}
function hover(d, e) {
  const rows = S.stats.filter(r => r[d.dataset.key] != null); if (rows.length < 2) return;
  const c = d.querySelector("canvas"), r = c.getBoundingClientRect();
  const i = Math.round((e.clientX - r.left) / r.width * (rows.length - 1));
  d.hover = Math.min(rows.length - 1, Math.max(0, i));
  const row = rows[d.hover], tip = d.querySelector(".tip"), dec = CHARTS.find(x => x[0] === d.dataset.key)[2];
  tip.querySelector("b").textContent = fmt(row[d.dataset.key], dec);
  tip.querySelector("span").textContent = "스텝 " + fmt(row.step);
  tip.style.display = "block";
  tip.style.left = Math.min(r.width - 150, Math.max(0, e.clientX - r.left - 60)) + "px";
  tip.style.top = (c.offsetTop - 26) + "px";
  drawChart(d);
}
function drawChart(d) {
  const key = d.dataset.key, dec = CHARTS.find(x => x[0] === key)[2];
  const rows = S.stats.filter(r => r[key] != null), c = d.querySelector("canvas"), g = c.getContext("2d");
  const r = c.getBoundingClientRect(), dp = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * dp); c.height = Math.round(r.height * dp);
  g.setTransform(dp, 0, 0, dp, 0, 0); g.clearRect(0, 0, r.width, r.height);
  if (rows.length < 2) return;
  const vals = rows.map(x => x[key]); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi += 1; lo -= 1; }
  const X = i => 2 + i / (rows.length - 1) * (r.width - 4), Y = v => r.height - 4 - (v - lo) / (hi - lo) * (r.height - 8);
  g.strokeStyle = css("--line"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, r.height - 0.5); g.lineTo(r.width, r.height - 0.5); g.stroke();
  if (S.frame) {   // 지금 보고 있는 프레임의 위치
    const t = S.frame.step, a = rows[0].step, b = rows[rows.length - 1].step;
    if (t >= a && t <= b && b > a) { const x = 2 + (t - a) / (b - a) * (r.width - 4); g.beginPath(); g.moveTo(x, 0); g.lineTo(x, r.height); g.stroke(); }
  }
  g.strokeStyle = css("--series-1"); g.lineWidth = 2; g.lineJoin = "round";
  g.beginPath(); vals.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.stroke();
  if (d.hover != null && d.hover < rows.length) {
    const x = X(d.hover), y = Y(vals[d.hover]);
    g.strokeStyle = css("--text-muted"); g.lineWidth = 1; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, r.height); g.stroke();
    g.fillStyle = css("--series-1"); g.beginPath(); g.arc(x, y, 4, 0, 6.2832); g.fill();
    g.strokeStyle = css("--surface-1"); g.lineWidth = 2; g.stroke();
  }
  d.querySelector(".val").textContent = fmt(vals[vals.length - 1], dec);
  const [a, b] = d.querySelectorAll(".range span");
  a.textContent = "최소 " + fmt(lo, dec) + " · 스텝 " + fmt(rows[0].step);
  b.textContent = "최대 " + fmt(hi, dec) + " · 스텝 " + fmt(rows[rows.length - 1].step);
}
function drawCharts() {
  document.querySelectorAll(".chart").forEach(drawChart);
  const rows = S.stats.slice(-12).reverse(), t = document.createElement("table");
  const head = ["스텝", "개체", "먹이", "세대", "뉴런", "재주입"], keys = ["step", "pop", "food", "gen_mean", "hidden_mean", "reseeds"], decs = [0, 0, 0, 1, 2, 0];
  const tr = document.createElement("tr"); head.forEach(h => { const th = document.createElement("th"); th.textContent = h; tr.append(th); }); t.append(tr);
  rows.forEach(r => { const tr = document.createElement("tr"); keys.forEach((k, i) => { const td = document.createElement("td"); td.textContent = fmt(r[k], decs[i]); tr.append(td); }); t.append(tr); });
  $("tablewrap").replaceChildren(t);
}

// ---- 조작 ----
$("run").addEventListener("change", async e => { S.run = e.target.value; S.selected = null; S.frame = null; S.fitted = false; S.steps = []; S.refreshing = false; setLive(true); await refresh(true); fit(); });
$("mode").addEventListener("change", draw);
$("ground").addEventListener("change", draw);
$("fit").addEventListener("click", () => { setFollow(false); fit(); });
$("follow").addEventListener("click", () => { setFollow(!S.follow && S.selected != null); draw(); });
$("live").addEventListener("click", () => { setLive(!S.live); if (S.live) refresh(); });
$("play").addEventListener("click", () => setPlaying(!S.playing));
$("slider").addEventListener("input", e => { setLive(false); setPlaying(false); S.idx = +e.target.value; showFrame(); });
$("clip").addEventListener("click", () => {
  const s = S.steps; let i = s.length - 1;
  while (i > 0 && s[i] - s[i - 1] !== 1) i--;
  if (i <= 0) { $("note").textContent = "촘촘히 녹화된 구간이 아직 없습니다"; return; }
  while (i > 0 && s[i] - s[i - 1] === 1) i--;
  setLive(false); S.idx = i; showFrame().then(() => setPlaying(true));
});
$("rec").addEventListener("click", async () => {
  const r = await fetch("/api/record?run=" + encodeURIComponent(S.run) + "&n=600", { method: "POST" });
  $("note").textContent = r.ok ? "녹화를 요청했습니다. 잠시 뒤 '촘촘한 구간'을 누르세요" : "요청 실패";
});
new ResizeObserver(() => { resize(); drawCharts(); }).observe($("mapwrap"));
setInterval(() => { if (S.playing && !S.busy) { if (S.idx < S.steps.length - 1) { S.idx++; showFrame(); } else setPlaying(false); } }, 60);
setInterval(() => { refresh().catch(() => {}); }, 2000);
setInterval(() => { loadRuns().catch(() => {}); }, 15000);
buildCharts(); resize(); loadRuns().catch(e => { $("note").textContent = "서버에 연결하지 못했습니다"; });
</script>
</body>
</html>
