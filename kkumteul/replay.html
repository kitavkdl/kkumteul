<!--HEAD-->
<title>꿈틀 다시 보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 배치: 관측 장비의 화면. 어두운 관측 창(지도) 하나가 주인공이고, 둘레는 그 창을 읽는 기록지다. 직각, 가는 선, 숫자는 고정폭.
   폰은 한 줄로, 넓은 화면은 지도 옆에 기록지. 귀여움은 빼고, 하찮미는 생물의 꼬리·잠·일생 자막에만 둔다. */
:root {
  --bg: #f1f2f0; --panel: #fafaf8; --ink: #161a1b; --dim: #4f5a5d; --faint: #7d878a; --line: #cfd4d3; --grid: #e2e5e4;
  --accent: #2f6275; --accent-ink: #ffffff; --wash: rgba(47, 98, 117, 0.09);
  --food: #3d7a50; --poison: #6b4fa8; --danger: #b8392f; --warn: #a87708; --series: #2f6275;
  --stage: #0c0f10; --stage-line: #2a3134; --stage-ink: #e8ecec; --stage-edge: rgba(232, 236, 236, 0.28);
  --stage-glass: rgba(12, 15, 16, 0.82); --stage-mark: rgba(232, 236, 236, 0.55); --stage-alert: #d8b25a;
  --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1213; --panel: #151a1b; --ink: #e4e8e8; --dim: #9ba5a7; --faint: #6f7a7c; --line: #2a3033; --grid: #1f2426;
    --accent: #8fb6c4; --accent-ink: #0c1a1f; --wash: rgba(143, 182, 196, 0.11);
    --food: #7fbf8f; --poison: #ab96dc; --danger: #f0685e; --warn: #d8b25a; --series: #7fa9bc;
    --stage: #0a0c0d; --stage-line: #2a3033; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1213; --panel: #151a1b; --ink: #e4e8e8; --dim: #9ba5a7; --faint: #6f7a7c; --line: #2a3033; --grid: #1f2426;
  --accent: #8fb6c4; --accent-ink: #0c1a1f; --wash: rgba(143, 182, 196, 0.11);
  --food: #7fbf8f; --poison: #ab96dc; --danger: #f0685e; --warn: #d8b25a; --series: #7fa9bc;
  --stage: #0a0c0d; --stage-line: #2a3033; color-scheme: dark;
}
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-text-size-adjust: 100%; }
#rp { max-width: 1180px; margin: 0 auto; padding-block: 18px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#rp [hidden] { display: none !important; }
#rp button { font-family: inherit; }
#rp button:focus-visible, #rp .rp-track:focus-visible, #rp summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#rp .rp-head { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
#rp .rp-eyebrow { font: 500 12px/1 var(--mono); letter-spacing: 0.08em; color: var(--dim); margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
#rp .rp-eyebrow span + span { color: var(--faint); }
#rp h1 { font-size: 22px; font-weight: 650; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
#rp .rp-intro { margin: 0; color: var(--dim); max-width: 68ch; font-size: 14.5px; }
#rp .rp-grid { display: grid; gap: 22px; margin-top: 16px; grid-template-columns: minmax(0, 1fr); }
#rp .rp-stagecol { min-width: 0; }
#rp .rp-stagewrap { width: min(100%, max(300px, calc(100vh - 290px))); max-width: 100%; margin: 0 auto; }
@media (min-width: 980px) {
  #rp .rp-grid { grid-template-columns: minmax(0, 1fr) 400px; align-items: start; }
  #rp .rp-stagecol { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
}

/* 한 줄 상태 */
#rp .rp-state { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; justify-content: space-between; margin: 0 0 6px; font-size: 13.5px; }
#rp .rp-keys { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; min-width: 0; }
#rp .rp-key { display: inline-flex; align-items: center; gap: 6px; }
#rp .rp-glyph { width: 9px; height: 9px; display: inline-block; flex: none; }
#rp .rp-glyph.circle { border-radius: 50%; }
#rp .rp-glyph.diamond { transform: rotate(45deg) scale(0.82); }
#rp .rp-glyph.good { background: var(--food); }
#rp .rp-glyph.bad { background: var(--poison); box-shadow: inset 0 0 0 2.5px var(--poison), inset 0 0 0 9px var(--bg); }
#rp .rp-pop { font: 500 13px/1.2 var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); }
#rp .rp-pop b { color: var(--ink); font-weight: 600; }

/* 관측 창 */
#rp .rp-stage { position: relative; aspect-ratio: 1; max-width: 100%; overflow: hidden; background: var(--stage); border: 1px solid var(--stage-line); }
#rp .rp-stage::after { content: ""; position: absolute; inset: 3px; pointer-events: none;
  background:
    linear-gradient(var(--stage-mark), var(--stage-mark)) left top / 12px 1px no-repeat,
    linear-gradient(var(--stage-mark), var(--stage-mark)) left top / 1px 12px no-repeat,
    linear-gradient(var(--stage-mark), var(--stage-mark)) right top / 12px 1px no-repeat,
    linear-gradient(var(--stage-mark), var(--stage-mark)) right top / 1px 12px no-repeat,
    linear-gradient(var(--stage-mark), var(--stage-mark)) left bottom / 12px 1px no-repeat,
    linear-gradient(var(--stage-mark), var(--stage-mark)) left bottom / 1px 12px no-repeat,
    linear-gradient(var(--stage-mark), var(--stage-mark)) right bottom / 12px 1px no-repeat,
    linear-gradient(var(--stage-mark), var(--stage-mark)) right bottom / 1px 12px no-repeat; }
#rp #rp-map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#rp #rp-mini { position: absolute; top: 12px; right: 12px; width: 27%; max-width: 132px; aspect-ratio: 1; padding: 0;
  border-radius: 0; border: 1px solid var(--stage-edge); background: var(--stage); cursor: pointer; overflow: hidden; }
#rp #rp-mini canvas { width: 100%; height: 100%; display: block; }
#rp .rp-cap { position: absolute; left: 12px; top: 12px; max-width: calc(73% - 28px); font-size: 13px; line-height: 1.4;
  color: var(--stage-ink); background: var(--stage-glass); border-left: 2px solid var(--stage-ink); border-radius: 0;
  padding: 5px 9px; pointer-events: none; }
#rp .rp-cap.toast { border-left-color: var(--stage-alert); }
#rp .rp-flash { position: absolute; inset: 0; border: 2px solid var(--stage-alert); opacity: 0; pointer-events: none; }
#rp .rp-flash.on { animation: rp-flash 1.3s ease-out; }
@keyframes rp-flash { from { opacity: 0.95; } to { opacity: 0; } }
#rp .rp-view { position: absolute; left: 12px; bottom: 12px; display: flex; border: 1px solid var(--stage-edge); background: var(--stage-glass); }
#rp .rp-view button { font-size: 12.5px; font-weight: 600; line-height: 1; padding: 9px 12px; border: 0; border-radius: 0; background: transparent;
  color: var(--stage-ink); cursor: pointer; }
#rp .rp-view button + button { border-left: 1px solid var(--stage-edge); }
#rp .rp-view button[aria-pressed="true"] { background: var(--stage-ink); color: var(--stage); }
#rp .rp-zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; border: 1px solid var(--stage-edge); background: var(--stage-glass); }
#rp .rp-zoom button { width: 36px; height: 36px; border: 0; border-radius: 0; background: transparent; color: var(--stage-ink);
  font: 17px/1 var(--mono); cursor: pointer; }
#rp .rp-zoom button + button { border-top: 1px solid var(--stage-edge); }

/* 시간 막대 */
#rp .rp-transport { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 10px; }
#rp .rp-btn { font-size: 14px; font-weight: 600; line-height: 1; height: 44px; min-width: 52px; padding: 0 12px; border-radius: 0;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
#rp #rp-speed { font-family: var(--mono); font-weight: 500; }
#rp .rp-btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 72px; }
#rp .rp-track { height: 44px; touch-action: none; cursor: pointer; min-width: 0; }
#rp .rp-track canvas { width: 100%; height: 100%; display: block; }
#rp .rp-stepline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font: 12px/1.4 var(--mono);
  color: var(--dim); margin-top: 6px; font-variant-numeric: tabular-nums; }
#rp #rp-step { color: var(--ink); }

/* 기록지 */
#rp .rp-panelcol { display: grid; gap: 24px; min-width: 0; }
#rp .rp-sec { min-width: 0; }
#rp .rp-sec > h2 { font: 600 12px/1.2 var(--font); letter-spacing: 0.06em; color: var(--dim); margin: 0 0 12px;
  padding-top: 8px; border-top: 1px solid var(--ink); display: flex; justify-content: space-between; gap: 8px; }
#rp .rp-sec > h2 small { font: 500 11px/1.2 var(--mono); color: var(--faint); letter-spacing: 0.02em; }
#rp .rp-who { background: var(--panel); border: 1px solid var(--line); padding: 0 14px 6px; }
#rp .rp-who > h2 { border-top: 0; padding-top: 12px; margin-left: -14px; margin-right: -14px; padding-left: 14px; padding-right: 14px;
  padding-bottom: 10px; border-bottom: 1px solid var(--line); }
#rp .rp-stars { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); }
#rp .rp-chip { flex: 1 1 auto; font-size: 12.5px; font-weight: 600; line-height: 1.2; padding: 9px 10px; border-radius: 0;
  border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; }
#rp .rp-chip:last-child { border-right: 0; }
#rp .rp-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#rp .rp-card { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 14px; }
#rp #rp-face { width: 60px; height: 60px; background: var(--stage); display: block; }
#rp .rp-name { font: 600 17px/1.25 var(--mono); margin: 0; letter-spacing: -0.01em; }
#rp .rp-why { color: var(--dim); font-size: 13px; margin: 2px 0 0; }
#rp .rp-facts { display: flex; flex-wrap: wrap; gap: 2px 14px; font: 12.5px/1.5 var(--mono); color: var(--dim); margin: 10px 0 0; }
#rp .rp-vital { margin: 10px 0 0; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
#rp .rp-energy { flex: 1 1 90px; max-width: 160px; height: 9px; background: var(--grid); overflow: hidden; position: relative; }
#rp .rp-energy::after { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--panel) calc(10% - 1px) 10%); }
#rp .rp-energy i { display: block; height: 100%; width: 0; background: var(--food); }
#rp .rp-link { font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; }
#rp .rp-sofar { font: 12.5px/1.5 var(--mono); color: var(--dim); margin: 6px 0 0; }
#rp .rp-story { list-style: none; margin: 12px -4px 0; padding: 0; max-height: 264px; overflow-y: auto; border-top: 1px solid var(--line);
  position: relative; overscroll-behavior: contain; }
#rp .rp-story button { display: grid; grid-template-columns: 50px 8px minmax(0, 1fr); gap: 9px; align-items: baseline; width: 100%;
  text-align: left; font-size: 14px; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--grid);
  padding: 7px 4px; cursor: pointer; }
#rp .rp-story .age { font: 12px/1.5 var(--mono); color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
#rp .rp-story .dot { width: 7px; height: 7px; align-self: center; background: var(--faint); }
#rp .rp-story .t-good .dot { background: var(--food); }
#rp .rp-story .t-poison .dot, #rp .rp-story .t-hit .dot { background: var(--danger); }
#rp .rp-story .t-born .dot, #rp .rp-story .t-child .dot { background: var(--accent); }
#rp .rp-story .t-died .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink); }
#rp .rp-story .t-gave .dot { background: var(--warn); }
#rp .rp-story li.future button { opacity: 0.42; }
#rp .rp-story li.now button { background: var(--wash); box-shadow: inset 2px 0 0 var(--accent); }
#rp .rp-fine { font-size: 12.5px; color: var(--faint); margin: 8px 0 0; line-height: 1.5; }

/* 현황 */
#rp .rp-verdict { font-size: 16px; line-height: 1.5; margin: 0 0 12px; }
#rp .rp-verdict strong { font-weight: 750; }
#rp .rp-bars { display: grid; grid-template-columns: auto minmax(0, 1fr) 42px; gap: 8px 10px; align-items: center; font-size: 13px; color: var(--dim); }
#rp .rp-bar { height: 9px; background: var(--grid); overflow: hidden; position: relative; }
#rp .rp-bar::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent calc(50% - 0.5px), var(--faint) calc(50% - 0.5px) calc(50% + 0.5px), transparent calc(50% + 0.5px)); }
#rp .rp-bar i { display: block; height: 100%; width: 0; }
#rp .rp-bar .b-eat { background: var(--poison); }
#rp .rp-bar .b-blind { background: var(--faint); }
#rp .rp-bars .num { font: 600 13px/1 var(--mono); color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
#rp .rp-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 0; margin-top: 16px;
  border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
#rp .rp-tile { padding: 8px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
#rp .rp-tile .k { font-size: 12px; color: var(--dim); }
#rp .rp-tile .v { font: 600 19px/1.3 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
#rp .rp-tile .s { font: 12px/1.4 var(--mono); color: var(--faint); min-height: 17px; }

/* 범례 */
#rp .rp-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px 14px; }
#rp .rp-lg { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
#rp .rp-lg canvas { width: 44px; height: 44px; background: var(--stage); display: block; }
#rp .rp-lg b { display: block; font-size: 13.5px; line-height: 1.3; }
#rp .rp-lg span { display: block; font-size: 12px; color: var(--dim); line-height: 1.35; }

/* 장기 기록 */
#rp .rp-long { position: relative; }
#rp #rp-longcv { width: 100%; display: block; touch-action: pan-y; }
#rp .rp-tip { position: absolute; top: 0; left: 0; pointer-events: none; background: var(--panel); border: 1px solid var(--ink);
  padding: 6px 9px; font: 12px/1.5 var(--mono); color: var(--dim); white-space: nowrap; }
#rp .rp-tip b { color: var(--ink); font-weight: 700; }
#rp details { margin-top: 8px; font-size: 13px; color: var(--dim); }
#rp summary { cursor: pointer; padding: 4px 0; }
#rp .rp-tablewrap { overflow-x: auto; }
#rp table { border-collapse: collapse; font: 12px/1.4 var(--mono); width: 100%; font-variant-numeric: tabular-nums; }
#rp th, #rp td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
#rp th { color: var(--dim); font-weight: 600; border-bottom-color: var(--ink); }
#rp .rp-about p { margin: 0 0 8px; font-size: 13.5px; color: var(--dim); max-width: 68ch; }
@media (prefers-reduced-motion: reduce) { #rp .rp-flash.on { animation: none; } }
</style>
<!--/HEAD-->
<div id="rp">
  <div class="rp-head">
    <p class="rp-eyebrow" id="rp-eyebrow"><span>꿈틀 · 관측 기록</span></p>
    <h1 id="rp-title">세계</h1>
    <p class="rp-intro" id="rp-intro"></p>
  </div>

  <div class="rp-grid">
    <div class="rp-stagecol">
      <div class="rp-stagewrap">
        <div class="rp-state">
          <div class="rp-keys" id="rp-keys"></div>
          <div class="rp-pop" id="rp-pop"></div>
        </div>
        <div class="rp-stage" id="rp-stage">
          <canvas id="rp-map" aria-label="관측 창. 끌면 움직이고, 생물을 누르면 그 생물을 따라갑니다."></canvas>
          <button type="button" id="rp-mini" aria-label="세계 전체 보기"><canvas id="rp-minicv"></canvas></button>
          <div class="rp-cap" id="rp-cap" aria-live="polite" hidden></div>
          <div class="rp-flash" id="rp-flash"></div>
          <div class="rp-view" role="group" aria-label="보는 범위">
            <button type="button" id="rp-near" aria-pressed="true">가까이</button>
            <button type="button" id="rp-far" aria-pressed="false">세계 전체</button>
          </div>
          <div class="rp-zoom">
            <button type="button" id="rp-zin" aria-label="확대">+</button>
            <button type="button" id="rp-zout" aria-label="축소">−</button>
          </div>
        </div>
        <div class="rp-transport">
          <button type="button" class="rp-btn primary" id="rp-play">멈춤</button>
          <button type="button" class="rp-btn" id="rp-speed" aria-label="재생 속도">1×</button>
          <div class="rp-track" id="rp-track" role="slider" tabindex="0" aria-label="장면 위치" aria-valuemin="0"><canvas id="rp-trackcv"></canvas></div>
        </div>
        <div class="rp-stepline"><span id="rp-step"></span><span id="rp-trackkey"></span></div>
      </div>
    </div>

    <div class="rp-panelcol">
      <div class="rp-sec rp-who">
        <h2>관측 대상 <small>지도에서 눌러 바꿈</small></h2>
        <div class="rp-stars" id="rp-stars"></div>
        <div class="rp-card">
          <canvas id="rp-face" width="120" height="120"></canvas>
          <div>
            <p class="rp-name" id="rp-name"></p>
            <p class="rp-why" id="rp-why"></p>
          </div>
        </div>
        <div class="rp-facts" id="rp-facts"></div>
        <div class="rp-vital">
          <span id="rp-vital"></span>
          <span class="rp-energy" id="rp-energy" role="img" aria-label="에너지"><i id="rp-energy-fill"></i></span>
          <button type="button" class="rp-link" id="rp-jump" hidden></button>
        </div>
        <p class="rp-sofar" id="rp-sofar"></p>
        <ol class="rp-story" id="rp-story" aria-label="이 생물의 일생"></ol>
        <p class="rp-fine">줄을 누르면 그 순간으로 갑니다. 왼쪽 숫자는 그때의 나이(스텝)입니다.</p>
      </div>

      <div class="rp-sec">
        <h2>현황 <small id="rp-nowstep"></small></h2>
        <p class="rp-verdict" id="rp-verdict"></p>
        <div class="rp-bars" id="rp-bars">
          <span>먹은 것 가운데 독</span><span class="rp-bar"><i class="b-eat" id="rp-bar-eat"></i></span><span class="num" id="rp-num-eat"></span>
          <span>눈 감고 먹으면</span><span class="rp-bar"><i class="b-blind" id="rp-bar-blind"></i></span><span class="num" id="rp-num-blind"></span>
        </div>
        <p class="rp-fine" id="rp-vfine"></p>
        <div class="rp-tiles" id="rp-tiles"></div>
      </div>

      <div class="rp-sec">
        <h2>범례</h2>
        <div class="rp-legend" id="rp-legend"></div>
      </div>

      <div class="rp-sec" id="rp-longsec" hidden>
        <h2>장기 기록 <small>원래 실행</small></h2>
        <div class="rp-long" id="rp-long">
          <canvas id="rp-longcv"></canvas>
          <div class="rp-tip" id="rp-tip" hidden></div>
        </div>
        <p class="rp-fine" id="rp-longnote"></p>
        <details>
          <summary>숫자로 보기</summary>
          <div class="rp-tablewrap"><table id="rp-table"></table></div>
        </details>
      </div>

      <div class="rp-sec rp-about">
        <h2>기록 정보</h2>
        <div id="rp-about"></div>
      </div>
    </div>
  </div>
</div>
<!--__REPLAY_DATA__-->
<script>
(function (root) {
  "use strict";

  // ===================== 계산 (화면 없이도 돈다. tests/replay_screen_check.js가 node에서 부른다) =====================
  var KK = {};
  KK.EV = { good: 1, poison: 2, gave: 3, hit: 4, born: 5, died: 6 };
  var EV = KK.EV;
  var TYPES = { u1: Uint8Array, i1: Int8Array, u2: Uint16Array, u4: Uint32Array, i4: Int32Array, f4: Float32Array, f8: Float64Array };

    var key = function (gid, tid, cls, text) {
      var k = el("span", "rp-key"), gl = el("span", "rp-glyph " + cls), tx = el("span", "", text);
      gl.id = gid; tx.id = tid; k.appendChild(gl); k.appendChild(tx); keys.appendChild(k);
    };
    key("rp-g-good", "rp-t-good", "good circle", "먹이");
    if (on.kinds) key("rp-g-bad", "rp-t-bad", "bad diamond", "독");
    $("rp-trackkey").textContent = (on.kinds ? "띠: 그때 독인 모양 · 세로줄: 독이 바뀌는 순간" : "") + (spans.length ? " · 노란 띠: 각본" : "");
  })();
  tile("pop", "개체 수"); tile("food", "놓인 먹이"); tile("brain", "뇌 크기(평균)");
  if (on.social) tile("gift", "에너지 건넴");
  if (on.conflict) tile("atk", "공격");
  $("rp-bars").hidden = !on.kinds;
  $("rp-vfine").hidden = !on.kinds;
  stars.forEach(function (s, i) {
    var b = el("button", "rp-chip", s.why.replace("가장 ", "").replace(/\s*개체$/, ""));
    b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { select(s.agent, { jump: true, near: true }); });
    $("rp-stars").appendChild(b);
  });
  $("rp-stars").hidden = !stars.length;
  legend(); setupLong(); about();
  track.setAttribute("aria-valuemax", nF - 1);
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe($("rp-stage"));
  window.addEventListener("resize", resize);
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", retheme);
  }
  if (window.MutationObserver) new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  var lead = stars.length ? stars[0].agent : (A.fr_off[1] > 0 ? A.fr_idx[0] : -1);
  if (lead >= 0) {
    select(lead, {});
    // 첫 주인공이 아직 안 태어났고 따라갈 어미도 안 보이면, 태어나는 장면에서 시작한다
    if (D.first[lead] > 0 && !(A.ag_parent[lead] >= 0 && KK.find(D, 0, A.ag_parent[lead]) >= 0)) t = D.first[lead];
  } else {
    setMode("world");
  }
  setPlaying(!reduce);
  requestAnimationFrame(tick);
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
